name: tugas_uas
# Nama project Flutter Anda.

description: "A new Flutter project."
# Deskripsi singkat mengenai project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Baris ini mencegah package dipublikasikan ke pub.dev secara tidak sengaja.

version: 1.0.0+1
# Versi aplikasi: formatnya major.minor.patch+build_number.
# Digunakan untuk versioning di Android, iOS, dan Windows.

environment:
  sdk: ^3.7.2
  # Versi minimum SDK Dart yang dibutuhkan untuk menjalankan project ini.

dependencies:
  flutter:
    sdk: flutter
    # Dependency utama untuk framework Flutter.

  cupertino_icons: ^1.0.8
  # Paket ikon bergaya iOS (Cupertino).

  image_picker: ^1.0.4
  # Untuk mengambil gambar dari galeri atau kamera.

  supabase_flutter: ^2.9.0
  # Library untuk integrasi dengan Supabase (backend as a service).

  top_snackbar_flutter: ^2.1.1
  # Untuk menampilkan snackbar di bagian atas layar.

  shared_preferences: ^2.2.0
  # Untuk menyimpan data sederhana secara lokal (key-value).

  flutter_colorpicker: ^1.0.3
  # Widget untuk memilih warna.

  flutter_local_notifications: ^16.3.2
  # Untuk menampilkan notifikasi lokal pada perangkat.

  permission_handler: ^11.3.1
  # Untuk meminta dan mengelola permission perangkat.

  timezone: ^0.9.2
  # Untuk mengelola zona waktu.

  another_flushbar: ^1.10.29
  # Alternatif lain untuk menampilkan snackbar.

  flutter_localizations:
    sdk: flutter
    # Mendukung multi-bahasa (localization) di aplikasi Flutter.

  intl: any
  # Paket internasionalisasi, mendukung format tanggal, angka, dsb.

  provider: ^6.1.5
  # State management menggunakan Provider.

  googleapis: ^13.1.0
  # Library untuk mengakses Google APIs.

  google_sign_in: ^6.1.5
  # Untuk autentikasi menggunakan akun Google.

  googleapis_auth: ^1.4.0
  # Untuk otentikasi OAuth2 dengan Google APIs.

  http: 1.4.0
  # Untuk melakukan request HTTP.

  file_picker: ^10.1.9
  # Untuk memilih file dari perangkat.

  path_provider: ^2.1.1
  # Untuk mendapatkan path direktori pada perangkat.

  universal_html: ^2.2.4
  # Untuk mengakses API HTML di berbagai platform.

  universal_io: ^2.2.2 # untuk deteksi platform
  # Untuk mengakses API IO di berbagai platform.

  android_alarm_manager_plus: ^3.0.3
  # Untuk menjalankan kode secara periodik di Android (background task).

  google_fonts: ^6.2.0 #Font modern dari Google
  # Untuk menggunakan font dari Google Fonts.

  flutter_svg: ^2.0.7 #Logo Google
  # Untuk menampilkan gambar SVG.

  palette_generator: ^0.3.3 #Untuk mengambil warna dari gambar
  # Untuk mengambil palet warna dari gambar.

dev_dependencies:
  flutter_test:
    sdk: flutter
    # Dependency untuk testing aplikasi Flutter.

  flutter_lints: ^5.0.0
  # Paket linter untuk memastikan kualitas kode.

